name: pancreas
h5ad: data/interim/pancreas_ready.h5ad
raw_loader: scvelo   # uses scvelo.datasets.pancreas()
tf_list: data/gt/lambert2018_tfs_mouse.txt
n_hvg: 3000
layer_X: Ms
layer_V: velocity

correlation:
  use_abs: false

geobridge:
  pair_knn: 30
  k: auto
  lambda: 1.0
  mode: dual
  residualize: true

grnboost:
  n_estimators: 1000
  n_jobs: 8

velorama:
  dag_source: velocity
  n_lags: 5

gt:
  dorothea: data/gt/dorothea_mouse_tierA.tsv
  chip_edges: data/gt/chip_pancreas.tsv
  chip_tfs: [Pdx1, Isl1, Pax6, Neurod1]   # ChEA coverage wall — narrow set
