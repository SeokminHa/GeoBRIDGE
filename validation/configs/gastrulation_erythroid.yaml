name: gastrulation_erythroid
h5ad: data/interim/gastrulation_erythroid_ready.h5ad
raw_loader: scvelo   # uses scvelo.datasets.gastrulation_erythroid()
tf_list: data/gt/lambert2018_tfs_mouse.txt
n_hvg: 3000
layer_X: Ms
layer_V: velocity

correlation:
  use_abs: false

geobridge:
