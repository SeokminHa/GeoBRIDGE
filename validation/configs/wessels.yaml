name: wessels
h5ad: data/interim/wessels_wt.h5ad       # WT trajectory only (for training)
h5ad_pert: data/interim/wessels_pert.h5ad # perturbed cells (for evaluation)
raw_loom: data/raw/wessels/wessels.loom
sra_list: data/raw/wessels/SRR_list.txt
tf_list: data/gt/lambert2018_tfs.txt
n_hvg: 3000
layer_X: Ms
layer_V: velocity

correlation:
  use_abs: false

geobridge:
  pair_knn: 30
  k: auto
  lambda: 1.0
  mode: dual
  residualize: true

grnboost:
  n_estimators: 1000
  n_jobs: 16

velorama:
  dag_source: velocity
  n_lags: 5

# Perturb-seq-specific
perturb:
  sgrna_key: perturbation
  control_labels: [non-targeting, NT, safe-harbor]
  min_cells_per_tf: 30
  de_method: wilcoxon
