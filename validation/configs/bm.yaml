name: bm
h5ad: data/interim/bm_ready.h5ad
raw_loader: scvelo   # uses scvelo.datasets.bonemarrow()
tf_list: data/gt/lambert2018_tfs.txt
n_hvg: 3000
layer_X: Ms          # moment-smoothed expression
layer_V: velocity

# per-method hyperparams
correlation:
  use_abs: false

geobridge:
  pair_knn: 30
  k: auto
  lambda: 1.0
  mode: dual         # xonly | dual
  residualize: true

grnboost:
  n_estimators: 1000
  n_jobs: 8

velorama:
  # pick ONE of: pseudotime | velocity (DAG construction)
  dag_source: velocity
  n_lags: 5

gt:
  dorothea: data/gt/dorothea_tierA.tsv
  chip_edges: data/gt/chip_bm.tsv
  chip_tfs: [GATA1, GATA2, SPI1, RUNX1, CEBPA, TAL1, KLF1]
