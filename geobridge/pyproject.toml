[project]
name = "geobridge"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy==1.26.4", "scipy==1.15.3", "pandas==2.3.3", "anndata==0.11.4", "h5py==3.16.0", "scanpy==1.11.5", "scvelo==0.3.4", "scikit-learn==1.7.2", "numexpr==2.14.1"]
[project.optional-dependencies]
test = ["pytest==9.1.1"]
[project.scripts]
geobridge = "geobridge.cli:main"
[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
geobridge = ["vendor/R/**/*", "vendor/iso/*"]
