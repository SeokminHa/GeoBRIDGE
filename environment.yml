# Python environment used for the paper (Python 3.10.0).
# Two further environments are needed only for Fig. 2 / Fig. 3 comparator runs (see figure2_synthetic/README.md):
#   velorama env : python 3.10, torch==1.13.0, velorama==0.0.3 (pip install from https://github.com/rs239/velorama, commit e315c5434387750250932cd594e4874e1690620c),
#                  scvelo==0.3.4, scanpy==1.11.5, cellrank==2.0.7, numpy==1.26.4
#   gb_sota env  : torch==2.5.1+cu121, regdiffusion==0.2.3, fasttenet==0.1.18, scvelo==0.3.4, numpy==1.26.4
# Their paths are given to the scripts through GB_VELORAMA_BIN / GB_GB_SOTA_BIN (bin directories); GB_JUPYTER_ENV_BIN = bin directory of this main environment.
name: geobridge
channels: [conda-forge]
dependencies:
  - python=3.10.0
  - pip
  - pip:
    - numpy==1.26.4
    - scipy==1.15.3
    - pandas==2.3.3
    - anndata==0.11.4
    - h5py==3.16.0
    - scikit-learn==1.7.2
    - scanpy==1.11.5
    - scvelo==0.3.4
    - numexpr==2.14.1
    - statsmodels==0.14.6
    - matplotlib==3.7.5
    - networkx==3.4.2
    - numba==0.66.0
    - leidenalg==0.11.0
    - cellrank==2.0.7        # Fig 3a streams / velocity graph helpers
    - pydeseq2==0.5.2        # KO truth re-analysis (pancreas, heart)
    - arboreto==0.1.6        # GENIE3 / GRNBoost2
    - dask==2023.12.1
    - torch==2.5.1           # PIDC (torch implementation in gb_sota_ext.py)
    - pytest==9.1.1
    - -e ./geobridge
